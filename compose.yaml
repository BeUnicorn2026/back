services:
  voice-partition:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      VOICE_PARTITION_DATA_DIR: /app/.data
    volumes:
      - voice-partition-data:/app/.data
    stop_grace_period: 15s

volumes:
  voice-partition-data:
